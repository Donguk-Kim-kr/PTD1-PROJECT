server {
    listen 80;
    server_name ptd1.pe.kr;

    root /usr/share/nginx/html;
    index home.html;

    # 1) 요청 경로 그대로 존재하면 그 파일/디렉터리를 서빙
    # 2) 없으면 .html을 붙여서 재시도 (예: /about -> about.html)
    # 3) 그래도 없으면 디렉터리 인덱스(=home.html) 시도
    # 4) 전부 실패하면 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
